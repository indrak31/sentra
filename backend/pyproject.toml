[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentra-backend"
version = "0.1.0"
description = "SENTRA — State-wise Environmental, Natural-disaster, Health-impact and Resource Optimization Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.55.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "sqlalchemy>=2.0.30,<2.1.0",
    "alembic>=1.13.1,<2.0.0",
    "psycopg[binary]>=3.1.19,<3.3.0",
    "pyjwt[crypto]>=2.8.0,<3.0.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "ortools>=9.10.4067,<10.0.0",
    "python-multipart>=0.0.9,<0.1.0",
    "email-validator>=2.1.1,<3.0.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
